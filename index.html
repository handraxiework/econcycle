<!DOCTYPE html>
<html lang="id">

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Peta Siklus Ekonomi</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #E8EFF4;
            --ink: #13273B;
            --mute: #5B6E80;
            --card: #F7FAFC;
            --line: #9BB0C2;
            --ac: #4A3FD1;
            font-family: "Bricolage Grotesque", system-ui, sans-serif
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5
        }

        .wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 20px 20px 40px
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            align-items: center;
            justify-content: space-between
        }

        h1 {
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 800;
            letter-spacing: -.02em;
            margin: 0
        }

        h2 {
            font-size: 15px;
            color: var(--mute);
            font-weight: 600;
            margin: 26px 0 10px
        }

        button {
            font: inherit;
            color: inherit
        }

        .btn {
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 10px;
            padding: 7px 14px;
            cursor: pointer
        }

        .btn:hover {
            border-color: var(--ac)
        }

        input {
            font: inherit;
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
            margin-top: 18px
        }

        input:focus {
            outline: 2px solid var(--ac);
            border-color: transparent
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px
        }

        .card {
            all: unset;
            box-sizing: border-box;
            cursor: pointer;
            display: block;
            background: var(--card);
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 1px 0 var(--line), inset 0 0 0 1px #fff
        }

        .card:hover,
        .card:focus-visible {
            box-shadow: 0 0 0 2px var(--ac)
        }

        .card b {
            display: block;
            margin: 6px 0 2px
        }

        .card p {
            margin: 0;
            font-size: 13.5px;
            color: var(--mute);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .tag {
            display: inline-block;
            font: 12px/1.6 inherit;
            padding: 0 10px;
            border-radius: 99px;
            background: #E3EBF2;
            margin: 0 4px 4px 0;
            border: 0
        }

        .tag.t {
            background: var(--ink);
            color: #fff
        }

        .tag.dr {
            background: #EDEFF2;
            color: #6B7785;
            border: 1px dashed #9AA6B2
        }

        .tag.ok {
            background: #D5F2E6;
            color: #0B7A62
        }

        .st-berlangsung {
            background: #FFE0DD;
            color: #9D2B32
        }

        .st-baru_terjadi {
            background: #FFEFCF;
            color: #8A5A06
        }

        .st-mereda {
            background: #E3EBF2
        }

        button.tag {
            cursor: pointer
        }

        button.tag:hover {
            background: #cfdbe6
        }

        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            align-items: center;
            margin: 16px 0 12px;
            font-size: 14px;
            color: var(--mute)
        }

        button.lk {
            all: unset;
            cursor: pointer;
            color: var(--ac);
            border-bottom: 1px solid transparent
        }

        button.lk:hover {
            border-color: var(--ac)
        }

        .bar b {
            color: var(--ink)
        }

        .phase {
            display: flex;
            gap: 6px;
            margin-left: auto
        }

        .phase span {
            padding: 2px 12px;
            border-radius: 99px;
            border: 1px solid var(--line);
            font-size: 13px
        }

        .phase .on {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink)
        }

        .main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 350px;
            gap: 20px;
            align-items: start
        }

        .stage {
            position: relative;
            border-radius: 24px;
            padding: 34px 24px;
            min-height: 500px;
            background: radial-gradient(circle at 50% 45%, #fff 0, #F1F6FA 55%, #DCE7EF 100%);
            box-shadow: inset 0 0 0 1px #fff, 0 1px 0 var(--line);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 54px;
            align-items: center
        }

        .col {
            display: flex;
            flex-direction: column;
            gap: 22px;
            align-items: center;
            position: relative;
            z-index: 1
        }

        .cap {
            font-size: 13px;
            color: var(--mute);
            text-align: center;
            max-width: 150px;
            margin: 0
        }

        #links {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none
        }

        #links path {
            fill: none;
            stroke: var(--line);
            stroke-width: 1.6
        }

        #links path.fb {
            stroke: var(--ac);
            stroke-dasharray: 6 5
        }

        #links text {
            font-size: 12px;
            fill: var(--mute);
            paint-order: stroke;
            stroke: #F1F6FA;
            stroke-width: 5px;
            text-anchor: middle
        }

        .bub {
            --t1: #e3ebf1;
            --t2: #a9bccb;
            --t3: rgba(70, 95, 120, .38);
            --t4: rgba(70, 95, 120, .45);
            position: relative;
            width: var(--s);
            height: var(--s);
            border-radius: 50%;
            border: 0;
            padding: 16px;
            cursor: pointer;
            display: grid;
            place-items: center;
            text-align: center;
            font: 600 13px/1.25 inherit;
            font-family: inherit;
            color: var(--ink);
            overflow: hidden;
            background: radial-gradient(circle at 50% 58%, var(--t1), var(--t2));
            box-shadow: inset 0 -12px 24px var(--t3), inset 0 0 0 1.5px rgba(255, 255, 255, .75), 0 18px 32px -14px var(--t4);
            animation: float 7s ease-in-out var(--d, 0s) infinite;
            transition: transform .25s
        }

        .bub::before {
            content: "";
            position: absolute;
            top: 9%;
            left: 15%;
            width: 42%;
            height: 26%;
            border-radius: 50%;
            background: linear-gradient(160deg, rgba(255, 255, 255, .95), rgba(255, 255, 255, 0));
            transform: rotate(-24deg)
        }

        .bub::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 200deg, rgba(255, 120, 200, .16), rgba(120, 200, 255, .2), rgba(150, 255, 200, .16), rgba(255, 230, 120, .16), rgba(255, 120, 200, .16));
            mix-blend-mode: soft-light;
            pointer-events: none
        }

        .bub span {
            position: relative;
            z-index: 1;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
            hyphens: auto
        }

        .bub:hover,
        .bub:focus-visible {
            transform: scale(1.06);
            outline: none;
            box-shadow: inset 0 -12px 24px var(--t3), inset 0 0 0 2.5px var(--ac), 0 18px 32px -14px var(--t4)
        }

        .pos {
            --t1: #d5f6ea;
            --t2: #6fd1b3;
            --t3: rgba(10, 125, 100, .38);
            --t4: rgba(18, 163, 138, .6)
        }

        .neg {
            --t1: #ffe0dd;
            --t2: #f19a97;
            --t3: rgba(190, 55, 60, .36);
            --t4: rgba(228, 87, 95, .6)
        }

        .mix {
            --t1: #ffefcf;
            --t2: #f0c36f;
            --t3: rgba(176, 115, 10, .34);
            --t4: rgba(224, 160, 30, .55)
        }

        .me {
            cursor: default;
            animation: none;
            font-size: 16px;
            font-weight: 800;
            box-shadow: inset 0 -14px 28px var(--t3), inset 0 0 0 1.5px rgba(255, 255, 255, .8), 0 0 0 10px rgba(74, 63, 209, .1), 0 0 0 22px rgba(74, 63, 209, .06), 0 24px 40px -14px var(--t4)
        }

        .me:hover {
            transform: none
        }

        @keyframes float {
            50% {
                transform: translateY(-7px)
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .bub {
                animation: none
            }
        }

        .panel {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 1px 0 var(--line), inset 0 0 0 1px #fff;
            position: sticky;
            top: 16px;
            max-height: calc(100vh - 32px);
            overflow: auto
        }

        .panel h2 {
            font-size: 21px;
            color: var(--ink);
            line-height: 1.15;
            margin: 0 0 8px
        }

        .panel h3 {
            font-size: 14px;
            margin: 18px 0 6px;
            color: var(--mute);
            font-weight: 600
        }

        .panel p {
            margin: 0 0 8px;
            font-size: 14px
        }

        .imp {
            border-top: 1px solid #DCE5EC;
            padding: 9px 0;
            font-size: 14px
        }

        .imp small,
        .lv small {
            display: block;
            color: var(--mute);
            font-size: 12.5px
        }

        .up {
            color: #0B7A62
        }

        .dn {
            color: #B8343B
        }

        .md {
            color: #936207
        }

        .lock {
            filter: blur(5px);
            user-select: none;
            pointer-events: none
        }

        .go {
            all: unset;
            cursor: pointer;
            display: block;
            padding: 8px 0;
            border-top: 1px solid #DCE5EC;
            font-size: 14px
        }

        .go:hover {
            color: var(--ac)
        }

        .def,
        .lv {
            font-size: 13px;
            background: #E8EEF8;
            border-radius: 10px;
            padding: 8px 10px;
            margin-top: 8px
        }

        .lv {
            background: #FFF6E4
        }

        .note {
            font-size: 12px;
            color: var(--mute);
            margin-top: 14px
        }

        .ld {
            position: fixed;
            inset: 0;
            display: grid;
            place-content: center;
            justify-items: center;
            gap: 14px;
            background: rgba(232, 239, 244, .82);
            z-index: 9
        }

        .ld[hidden] {
            display: none
        }

        .tile {
            padding: 22px;
            border-radius: 20px;
            background: #7E97AB
        }

        .ld p {
            margin: 0;
            font-size: 14px;
            color: var(--ink)
        }

        .loader {
            width: 40px;
            aspect-ratio: 1;
            background: radial-gradient(farthest-side, #000 90%, #0000) 50%/8px 8px no-repeat, conic-gradient(from -90deg at 15px 15px, #0000 90deg, #fff 0) 0 0/25px 25px;
            animation: l7 1s infinite
        }

        @keyframes l7 {
            0% {
                background-position: 50%, 0 0
            }

            50% {
                background-position: 50%, 25px 0
            }

            100% {
                background-position: 50%, 25px 25px
            }
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin: 14px 0 0;
            padding-bottom: 4px;
            scrollbar-width: none
        }

        .tabs button,
        .chip {
            flex: none;
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 99px;
            padding: 9px 16px;
            min-height: 40px;
            cursor: pointer
        }

        .tabs .on,
        .chip.on {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink)
        }

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin: 12px 0;
            padding-bottom: 4px;
            scrollbar-width: none
        }

        .bd {
            background: var(--card);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 0 var(--line), inset 0 0 0 1px #fff
        }

        .bd h3 {
            margin: 8px 0 4px;
            font-size: 17px
        }

        .bd p {
            margin: 0 0 6px;
            font-size: 14px
        }

        .mu {
            color: var(--mute);
            font-size: 13px !important
        }

        .tw {
            overflow-x: auto;
            border-radius: 16px;
            background: var(--card);
            box-shadow: 0 1px 0 var(--line)
        }

        .ct {
            border-collapse: separate;
            border-spacing: 0;
            min-width: 100%;
            font-size: 13px
        }

        .ct th,
        .ct td {
            padding: 10px 6px;
            text-align: center;
            border-bottom: 1px solid #DCE5EC;
            min-width: 78px;
            font-weight: 600
        }

        .ct th:first-child {
            position: sticky;
            left: 0;
            z-index: 1;
            background: var(--card);
            text-align: left;
            min-width: 124px;
            border-right: 1px solid #DCE5EC
        }

        .cell {
            all: unset;
            cursor: pointer;
            display: grid;
            justify-items: center;
            gap: 3px;
            padding: 6px 10px;
            border-radius: 10px;
            font-weight: 400
        }

        .cell:hover,
        .cell:focus-visible {
            background: #E3EBF2
        }

        .dot {
            display: block;
            border-radius: 50%;
            background: var(--ink)
        }

        .s3 {
            width: 18px;
            height: 18px
        }

        .s2 {
            width: 12px;
            height: 12px
        }

        .s1 {
            width: 7px;
            height: 7px
        }

        .cell.dr .dot,
        .dot.dr {
            background: transparent;
            border: 2px dashed var(--ink)
        }

        .na {
            color: #9AA6B2
        }

        .legend .dot {
            display: inline-block;
            vertical-align: middle;
            margin: 0 4px 0 12px
        }

        .cn {
            margin: 0 0 0 14px;
            padding: 8px 0 8px 18px;
            border-left: 3px dotted var(--line)
        }

        .cn b {
            font-size: 12.5px;
            color: var(--ac);
            text-transform: uppercase;
            letter-spacing: .05em
        }

        .cn p {
            margin: 2px 0;
            font-size: 14.5px
        }

        .cn small {
            color: var(--mute);
            font-size: 12.5px
        }

        .st {
            background: var(--card);
            border-radius: 16px;
            padding: 12px 16px;
            border-left: 6px solid var(--line);
            box-shadow: 0 1px 0 var(--line), inset 0 0 0 1px #fff
        }

        .st.pos {
            border-left-color: #6fd1b3
        }

        .st.neg {
            border-left-color: #f19a97
        }

        .st.mix {
            border-left-color: #f0c36f
        }

        .st .k {
            display: block;
            font-size: 11.5px;
            letter-spacing: .06em;
            color: var(--mute)
        }

        .st b {
            font-size: 17px
        }

        .st p {
            margin: 4px 0;
            font-size: 13.5px;
            color: var(--mute)
        }

        .tag.tp {
            background: #D5F2E6;
            color: #0B7A62
        }

        .tag.tn {
            background: #FFE0DD;
            color: #9D2B32
        }

        .tag.tm {
            background: #FFEFCF;
            color: #8A5A06
        }

        .lanes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 12px;
            margin: 12px 0
        }

        .ln h3 {
            margin: 0;
            font-size: 16px
        }

        .ln .q {
            color: var(--mute);
            font-size: 13px;
            margin: 0 0 6px
        }

        .it {
            border-top: 1px solid #DCE5EC;
            padding: 8px 0;
            font-size: 14px
        }

        .it small {
            display: block;
            color: var(--mute);
            font-size: 12.5px
        }

        .ar {
            font-weight: 800;
            margin-right: 6px
        }

        .ar.u {
            color: #0B7A62
        }

        .ar.d {
            color: #B8343B
        }

        .ar.m {
            color: #936207
        }

        @media(max-width:900px) {
            .main {
                grid-template-columns: 1fr
            }

            .panel {
                position: static;
                max-height: none
            }

            .stage {
                grid-template-columns: 1fr;
                gap: 26px;
                padding: 26px 12px
            }

            #links {
                display: none
            }

            .phase {
                margin-left: 0
            }
        }
    </style>
</head>

<body>
    <div class="ld" id="ld" role="status" aria-live="polite">
        <div class="tile">
            <div class="loader"></div>
        </div>
        <p id="ldm">Memuat data…</p>
    </div>
    <div class="wrap">
        <header>
            <h1>Peta siklus ekonomi</h1>
            <div><button class="btn" id="rf">Muat ulang data</button></div>
        </header>
        <nav class="tabs" id="tabs"><button data-m="home">Beranda</button><button data-m="board">Papan
                kejadian</button><button data-m="cmp">Bandingkan saham</button></nav>
        <div id="app"></div>
    </div>
    <script>
        const DEMO = {
            scenarios: [{ id: 'SC01', judul: 'Contoh skenario', node_pembuka: 'N003', jenis: 'berjalan' }],
            nodes: [{ id: 'N002', judul: 'Pasokan minyak terganggu', skala_dampak: '4', deskripsi: 'Data contoh.', akses: 'free' }, { id: 'N003', judul: 'Harga minyak naik', skala_dampak: '4', deskripsi: 'Data contoh.', fase_siklus: 'Puncak', istilah_kunci: 'HPP', akses: 'free' }, { id: 'N006', judul: 'HPP manufaktur naik', skala_dampak: '3', deskripsi: 'Data contoh.', akses: 'free' }],
            edges: [{ dari_node: 'N002', ke_node: 'N003', jeda_waktu: '1-4 minggu', keyakinan: 'tinggi', tipe_edge: 'causal' }, { dari_node: 'N003', ke_node: 'N006', jeda_waktu: '1-3 bulan', keyakinan: 'tinggi', tipe_edge: 'causal' }],
            impacts: [{ node_id: 'N003', target_tipe: 'sektor', target_id: 'S01', arah: 'positif', saluran: 'pendapatan', horizon: '1-6 bulan', alasan: 'Harga jual naik.', status: 'draft' }],
            sectors: [{ id: 'S01', nama_sektor: 'Migas hulu', deskripsi: 'Produsen minyak dan gas.' }], stocks: [{ ticker: 'MEDC', nama: 'Medco Energi', sektor_id: 'S01', eksposur: 'Produsen migas' }],
            glossary: [{ istilah: 'HPP', definisi: 'Harga pokok produksi.' }], factors: [{ id: 'harga_komoditas', label: 'Harga komoditas' }],
            stock_profile: [{ ticker: 'MEDC', faktor: 'harga_komoditas', besar: 'besar', keterangan: 'Pendapatan bergantung harga minyak.', keyakinan: 'tinggi', status: 'draft' }],
            live_status: [{ id: 'L01', node_id: 'N003', status: 'berlangsung', ringkasan: 'Data contoh.', indikator_pantau: 'Harga Brent', diperbarui: '2026-11-09', akses: 'free' }]
        };

        const $ = s => document.querySelector(s), E = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const FASE = ['Ekspansi', 'Puncak', 'Kontraksi', 'Pemulihan'], CL = { positif: 'up', negatif: 'dn', campuran: 'md' }, ST = { berlangsung: 'Berlangsung', baru_terjadi: 'Baru terjadi', mereda: 'Mereda' };
        const DISC = 'Konten edukasi, bukan rekomendasi beli atau jual saham.';
        let D, trail = [], busyN = 0;
        const busy = (d, m) => { busyN += d; if (m) $('#ldm').textContent = m; $('#ld').hidden = busyN <= 0 };
        async function load(msg, fresh) { busy(1, msg); try { const r = await fetch('data.json', fresh ? { cache: 'reload' } : {}); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json() } finally { busy(-1) } }
        const fail = e => { $('#app').innerHTML = '<p class="note">Data gagal dimuat: ' + E(e && e.message) + '</p>' };
        const boot = e => location.protocol === 'file:' ? init(DEMO) : fail(e);
        load('Memuat data…').then(init).catch(boot);
        $('#rf').onclick = () => load('Memperbarui data…', true).then(init).catch(fail);
        $('#tabs').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; mode = b.dataset.m; trail = []; chainId = stockId = null; hist = []; view() };

        function init(d) {
            D = d; for (const k of ['scenarios', 'nodes', 'edges', 'impacts', 'sectors', 'stocks', 'glossary', 'factors', 'stock_profile', 'live_status']) D[k] = D[k] || [];
            D.live = D.live_status; D.nm = Object.fromEntries(D.nodes.map(n => [n.id, n])); D.sm = Object.fromEntries(D.sectors.map(s => [s.id, s])); D.tm = Object.fromEntries(D.stocks.map(s => [s.ticker, s])); D.fm = Object.fromEntries(D.factors.map(f => [f.id, f])); trail = []; chainId = stockId = null; hist = []; view()
        }
        const view = () => { trail.length ? graph() : stockId ? stockCard() : chainId ? chain() : mode === 'board' ? board() : mode === 'cmp' ? cmp() : home(); document.querySelectorAll('#tabs [data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === mode && !trail.length && !chainId && !stockId)) };
        function go(c, d) {
            if (!trail.length && !c.map && c.t !== 's') { snap(); chainId = c.t === 'n' ? c.id : null; stockId = c.t === 'k' ? c.id : null; forced = []; view(); scrollTo(0, 0); return }
            if (!trail.length) snap();

                const k = o.find(e => e.ke_node === fo[p.length]) || o[0]; p.push({ id: k.ke_node, e: k, alt: o.filter(x => x !== k) }); seen.add(k.ke_node)
            }
            return p
        }
        function chain() {
            if (!D.nm[chainId]) { chainId = null; return home() }
            const P = curP = buildPath(chainId, forced), W = ['maka', 'sehingga', 'akibatnya', 'lalu', 'kemudian', 'pada akhirnya', 'dan akhirnya', 'berikutnya'], liv = new Set(D.live.filter(l => l.status !== 'mereda').map(l => l.node_id));
            const rs = D.scenarios.filter(x => x.node_pembuka === chainId || (D.scenario_nodes || []).some(y => y.scenario_id === x.id && y.node_id === chainId));
            let h = `${bk()}<h2>Alur sebab-akibat</h2><p class="mu">Dibaca dari atas ke bawah. Ketuk judul untuk memulai alur dari titik itu.</p>${rs.length ? `<p class="mu">Bagian dari skenario: ${rs.map(x => `<button class="tag" data-t="n" data-id="${E(x.node_pembuka)}" data-d="R">${E(x.judul)}${x.siklus_besar ? ' · ' + E(SB[x.siklus_besar] || x.siklus_besar) : ''}</button>`).join(' ')}</p>` : ''}`;
            P.forEach((x, i) => {
                const n = D.nm[x.id];
                if (i) { const e = x.e; h += `<div class="cn"><b>${W[Math.min(i - 1, W.length - 1)]}</b>${e.arah_dampak === 'negatif' ? ' <span class="tag">arah berlawanan</span>' : ''}<p>${E(e.mekanisme)}</p><small>Jeda ${E(e.jeda_waktu)} · keyakinan ${E(e.keyakinan)}</small></div>` }
                const nx = P[i + 1];
                h += `<div class="st ${nTone(x.id)}"><span class="k">${i ? 'LANGKAH ' + (i + 1) : 'KARENA'}</span>${bt('n', x.id, 'R', n.judul)}${n.fase_siklus ? ` <span class="tag t">${E(n.fase_siklus)}</span>` : ''}${liv.has(x.id) ? ' <span class="tag st-berlangsung">Sedang berlangsung</span>' : ''}<p>${E(n.deskripsi)}</p>${nx && nx.alt.length ? `<p class="mu">Kemungkinan lain setelah ini: ${nx.alt.map(o => `<button class="tag" data-fork="${i + 1}|${E(o.ke_node)}">${E(D.nm[o.ke_node].judul)}</button>`).join(' ')}</p>` : ''}</div>`
            });
            const last = P[P.length - 1].id, fb = D.edges.filter(e => e.dari_node === last && e.tipe_edge === 'feedback' && D.nm[e.ke_node]);
            if (fb.length) h += `<p class="mu">↺ Lingkaran umpan balik: ${fb.map(e => E(e.mekanisme)).join(' ')}</p>`;
            const ids = P.map(x => x.id), ag = {}; D.impacts.filter(i => ids.includes(i.node_id)).forEach(i => { const k = i.target_tipe + '|' + i.target_id; (ag[k] = ag[k] || []).push(i.arah) });
            const ch = Object.entries(ag).slice(0, 16).map(([k, a]) => { const [t, id] = k.split('|'), l = t === 'saham' ? id : (D.sm[id] || {}).nama_sektor; return l ? bt(t === 'saham' ? 'k' : 's', id, 'R', l, 'tag ' + (TC[tn(a)] || '')) : '' }).join(' ');
            h += `<h2>Sektor dan saham yang terpapar di alur ini</h2><p class="mu">Hijau menguntungkan, merah menekan, kuning campuran. Pemetaan masih berstatus draft.</p><div>${ch || '<p class="mu">Belum ada pemetaan.</p>'}</div><p><button class="btn" data-t="n" data-id="${E(chainId)}" data-d="R" data-map="1">Buka di peta bubble</button></p><p class="note">${DISC}</p>`;
            $('#app').innerHTML = h
        }
        const LANES = [['pendapatan', 'Pendapatan', 'Dari mana uang masuk, dan apa yang bisa mengubahnya?', /pendapatan|volume|permintaan/], ['biaya', 'Biaya', 'Apa yang membuat ongkos produksi dan operasional naik atau turun?', /biaya|margin|hpp/], ['utang', 'Utang', 'Seberapa besar beban bunga, kurs, dan pinjaman?', /utang|bunga|kredit|rekapitalisasi/], ['valuasi', 'Valuasi', 'Bagaimana pasar menilai saham ini?', /valuasi/], ['lain', 'Lainnya', '', null]];
        const FL = { kemasan_plastik: ['biaya'], bahan_baku_impor: ['biaya'], bahan_kimia_petrokimia: ['biaya'], energi_intensif: ['biaya'], tenaga_kerja: ['biaya'], pass_through_terbatas: ['biaya'], pendapatan_usd: ['pendapatan'], harga_komoditas: ['pendapatan'], konsumsi_domestik: ['pendapatan'], belanja_negara: ['pendapatan'], cuaca_musiman: ['pendapatan'], utang_usd: ['utang'], sensitif_bunga: ['utang', 'valuasi'], valuasi_growth: ['valuasi'] };
        function stockCard() {
            const s = D.tm[stockId]; if (!s) { stockId = null; return home() }
            const sec = D.sm[s.sektor_id], liv = new Set(D.live.filter(l => l.status !== 'mereda').map(l => l.node_id)), L = {}, put = (k, x) => (L[k] = L[k] || []).push(x),
                imp = D.impacts.filter(i => D.nm[i.node_id] && ((i.target_tipe === 'saham' && i.target_id === s.ticker) || (i.target_tipe === 'sektor' && i.target_id === s.sektor_id))), pf = D.stock_profile.filter(p => p.ticker === s.ticker);
            const JL = j => { const a = String(j || '').toLowerCase().split(/[,|]/).map(x => x.trim()).filter(x => LANES.some(l => l[0] === x)); return a.length ? a : null };
            pf.forEach(p => (JL(p.jalur) || FL[p.faktor] || ['lain']).forEach(k => put(k, { p })));
            imp.forEach(i => { const ks = JL(i.jalur) || LANES.filter(l => l[3] && l[3].test(i.saluran || '')).map(l => l[0]); (ks.length ? ks : ['lain']).forEach(k => put(k, { i })) });
            const it = x => x.p ? `<div class="it"><i class="dot s${SZ[x.p.besar] || 2} ${x.p.status === 'verified' ? '' : 'dr'}" style="display:inline-block;vertical-align:middle;margin-right:8px"></i><b>${E(fl(x.p.faktor))}</b> <span class="tag">Eksposur ${E(x.p.besar)}</span>${dr(x.p)}<small>${E(x.p.keterangan)}</small></div>`
                : `<div class="it"><span class="ar ${x.i.arah === 'positif' ? 'u' : x.i.arah === 'negatif' ? 'd' : 'm'}">${x.i.arah === 'positif' ? '▲' : x.i.arah === 'negatif' ? '▼' : '◆'}</span>${bt('n', x.i.node_id, 'R', D.nm[x.i.node_id].judul)} ${liv.has(x.i.node_id) ? '<span class="tag st-berlangsung">Sedang berlangsung</span>' : ''}${dr(x.i)}<small class="${D.nm[x.i.node_id].akses === 'premium' ? 'lock' : ''}">${x.i.arah === 'positif' ? 'Menguntungkan' : x.i.arah === 'negatif' ? 'Menekan' : 'Campuran'}. ${E(x.i.alasan)} (${E(x.i.horizon)})</small></div>`;
            const peers = D.stocks.filter(x => x.sektor_id === s.sektor_id && x.ticker !== s.ticker);
            $('#app').innerHTML = `${bk()}<h2>${E(s.ticker)} <small class="mu">${E(s.nama)}</small></h2><p class="mu">${sec ? bt('s', sec.id, 'R', sec.nama_sektor) : ''}${s.eksposur ? ' · ' + E(s.eksposur) : ''}</p>
 <p class="mu legend">▲ menguntungkan · ▼ menekan · ◆ campuran · titik atau tanda "Draft" = belum diverifikasi</p>
 <div class="lanes">${LANES.filter(l => l[0] !== 'lain' || (L.lain || []).length).map(l => `<section class="bd ln"><h3>${l[1]}</h3>${l[2] ? `<p class="q">${l[2]}</p>` : ''}${(L[l[0]] || []).map(it).join('') || '<p class="mu">Belum ada faktor tercatat.</p>'}</section>`).join('')}</div>
 ${peers.length ? `<p class="mu">Saham sejenis: ${peers.map(x => bt('k', x.ticker, 'R', x.ticker, 'tag')).join(' ')} <button class="btn" data-cmpg="${E(s.sektor_id)}">Bandingkan</button></p>` : ''}
 <p><button class="btn" data-t="k" data-id="${E(s.ticker)}" data-d="R" data-map="1">Lihat di peta bubble</button></p>
 <p class="note">Menampilkan efek positif dan negatif tanpa skor atau peringkat. ${pf.concat(imp).some(r => r.status !== 'verified') ? 'Sebagian data sedang diverifikasi. ' : ''}${DISC}</p>`
        }

        document.addEventListener('click', e => {
            const sfb = e.target.closest('[data-sf]'); if (sfb) { sf = sfb.dataset.sf; scGrid(); document.querySelectorAll('[data-sf]').forEach(b => b.classList.toggle('on', b.dataset.sf === sf)); return }
            const bkb = e.target.closest('[data-back]'); if (bkb) { const h = hist.pop(); if (h) { mode = h.mode; chainId = h.chainId; stockId = h.stockId; trail = h.trail; forced = h.forced; view(); scrollTo(0, 0) } return }
            const fk = e.target.closest('[data-fork]'); if (fk) { const [i, id] = fk.dataset.fork.split('|'); forced = [...curP.slice(0, +i).map(x => x.id), id]; chain(); return }
            const chb = e.target.closest('[data-chain]'); if (chb) { snap(); trail = []; chainId = chb.dataset.id; stockId = null; forced = []; view(); scrollTo(0, 0); return }
            const cdb = e.target.closest('[data-card]'); if (cdb) { snap(); trail = []; stockId = cdb.dataset.id; chainId = null; view(); scrollTo(0, 0); return }
            const cgb = e.target.closest('[data-cmpg]'); if (cgb) { mode = 'cmp'; cg = cgb.dataset.cmpg; cc = cf = null; trail = []; chainId = stockId = null; hist = []; view(); return }
            const a1 = e.target.closest('[data-bf]'); if (a1) { bf = a1.dataset.bf; board(); return }
            const a2 = e.target.closest('[data-cg]'); if (a2) { cg = a2.dataset.cg; cc = cf = null; cmp(); return }
            const a3 = e.target.closest('[data-cf],[data-cell]'); if (a3) { cf = a3.dataset.cf || null; cc = a3.dataset.cell || null; $('#cd').innerHTML = cdet(); $('#cd').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); return }
            const ix = e.target.closest('[data-ix]'); if (ix) { trail = trail.slice(0, +ix.dataset.ix + 1); view(); return }
            const tm = e.target.closest('[data-term]'); if (tm) { const g = D.glossary.find(x => x.istilah.toLowerCase() === tm.dataset.term.toLowerCase()); $('#def').innerHTML = `<div class="def"><b>${E(tm.dataset.term)}</b>: ${E(g ? g.definisi : 'Definisi belum ditambahkan.')}</div>`; return }
            const b = e.target.closest('[data-t]'); if (b && !b.classList.contains('me')) go({ t: b.dataset.t, id: b.dataset.id, map: b.dataset.map }, b.dataset.d || 'R')
        });
    </script>
</body>
