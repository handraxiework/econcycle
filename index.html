        function cdet() {

                const [t, f] = cc.split('|'), p = D.stock_profile.find(x => x.ticker === t && x.faktor === f); if (!p) return '';
                return `<div class="flex flex-wrap items-center gap-2 mb-2"><b class="font-mono text-title-md">${E(t)} · ${E((D.fm[f] || {}).label || f)}</b> <span class="px-2.5 py-0.5 rounded-sm bg-pastel-sky text-on-pastel-sky font-label text-label-sm">${E(p.besar)}</span> ${dr(p)}</div><p class="text-body-md text-light-on-surface">${E(p.keterangan)}</p><p class="text-label-sm text-light-on-surface-variant mt-1">Keyakinan ${E(p.keyakinan)}.</p>`;
            }
            if (cf) {
                const fx = D.fm[cf] || {}, r = D.stock_profile.filter(x => x.faktor === cf && D.tm[x.ticker]).sort((a, b) => (SZ[b.besar] || 0) - (SZ[a.besar] || 0));
                return `<b class="font-headline text-title-md">${E(fx.label || cf)}</b><p class="text-body-md text-light-on-surface-variant mt-1">${E(fx.penjelasan || '')}</p><div class="mt-3 flex flex-col gap-2">${r.map(x => `<div class="border-t border-light-outline-variant/50 pt-2 flex flex-wrap items-center gap-2">${bt('k', x.ticker, 'R', x.ticker)} <span class="px-2.5 py-0.5 rounded-sm bg-pastel-sky text-on-pastel-sky font-label text-label-sm">${E(x.besar)}</span> ${dr(x)} <small class="text-label-sm text-light-on-surface-variant">${E(D.tm[x.ticker].nama)}</small></div>`).join('')}</div>`;
            }
            return '<p class="text-body-md text-light-on-surface-variant">Ketuk sel untuk melihat alasannya, atau ketuk nama faktor untuk melihat semua saham yang terkena.</p>';
        }

        const snap = () => { hist.push({ mode, chainId, stockId, trail: trail.slice(), forced: forced.slice() }); if (hist.length > 30) hist.shift(); };
        const bk = () => hist.length ? '<button type="button" data-back="1" class="inline-flex items-center gap-1 px-3.5 py-1.5 rounded-sm bg-light-surface-container-lowest border border-light-outline-variant font-label text-label-lg text-light-on-surface hover:border-light-primary cursor-pointer">← Kembali</button>' : '';
        const fl = f => (D.fm[f] || {}).label || f, KY = { tinggi: 3, sedang: 2, rendah: 1 }, TC = { pos: 'bg-pastel-mint text-on-pastel-mint', neg: 'bg-pastel-rose text-on-pastel-rose', mix: 'bg-pastel-amber text-on-pastel-amber' };
        const nextOf = id => D.edges.filter(e => e.dari_node === id && e.tipe_edge !== 'feedback' && D.nm[e.ke_node]).sort((a, b) => (KY[b.keyakinan] || 0) - (KY[a.keyakinan] || 0));

        function buildPath(start, fo) {
            const p = [{ id: start }], seen = new Set([start]);
            while (p.length < 9) {
                const o = nextOf(p[p.length - 1].id).filter(e => !seen.has(e.ke_node)); if (!o.length) break;
                const k = o.find(e => e.ke_node === fo[p.length]) || o[0]; p.push({ id: k.ke_node, e: k, alt: o.filter(x => x !== k) }); seen.add(k.ke_node);
            }
            return p;
        }

        function chain() {
            if (!D.nm[chainId]) { chainId = null; return home(); }
            const P = curP = buildPath(chainId, forced), W = ['maka', 'sehingga', 'akibatnya', 'lalu', 'kemudian', 'pada akhirnya', 'dan akhirnya', 'berikutnya'], liv = new Set(D.live.filter(l => l.status !== 'mereda').map(l => l.node_id));
            const rs = D.scenarios.filter(x => x.node_pembuka === chainId || (D.scenario_nodes || []).some(y => y.scenario_id === x.id && y.node_id === chainId));
            let h = `<div class="flex flex-wrap items-center gap-3">${bk()}<h2 class="font-headline text-headline-md text-light-on-surface">Alur sebab-akibat</h2></div>
        <p class="text-body-md text-light-on-surface-variant">Dibaca dari atas ke bawah. Ketuk judul untuk memulai alur dari titik itu.</p>
        ${rs.length ? `<p class="text-label-sm text-light-on-surface-variant flex flex-wrap items-center gap-1.5">Bagian dari skenario: ${rs.map(x => `<button type="button" data-t="n" data-id="${E(x.node_pembuka)}" data-d="R" class="px-3 py-1 rounded-sm bg-pastel-lavender text-on-pastel-lavender font-label text-label-sm cursor-pointer hover:bg-light-primary hover:text-light-on-primary">${E(x.judul)}${x.siklus_besar ? ' · ' + E(SB[x.siklus_besar] || x.siklus_besar) : ''}</button>`).join(' ')}</p>` : ''}
        <div class="flex flex-col gap-2">`;
            P.forEach((x, i) => {
                const n = D.nm[x.id];
                if (i) { const e = x.e; h += `<div class="ml-4 pl-5 py-2 border-l-2 border-dashed border-light-primary/40 flex flex-col gap-0.5"><div class="flex flex-wrap items-center gap-2"><b class="font-mono text-label-sm uppercase text-light-primary">${W[Math.min(i - 1, W.length - 1)]}</b>${e.arah_dampak === 'negatif' ? '<span class="px-2 py-0.5 rounded-sm bg-pastel-rose text-on-pastel-rose font-label text-label-sm">arah berlawanan</span>' : ''}</div><p class="text-body-md text-light-on-surface">${E(e.mekanisme)}</p><small class="text-label-sm text-light-on-surface-variant">Jeda ${E(e.jeda_waktu)} · keyakinan ${E(e.keyakinan)}</small></div>`; }
                const nx = P[i + 1];
                h += `<div class="bg-pastel-lavender border border-light-outline-variant/70 rounded-sm p-4 shadow-sm flex flex-col gap-1.5"><div class="flex flex-wrap items-center gap-2"><span class="font-mono text-label-sm text-light-on-surface-variant">${i ? 'LANGKAH ' + (i + 1) : 'KARENA'}</span>${n.fase_siklus ? `<span class="px-2.5 py-0.5 rounded-sm bg-light-on-surface text-light-surface font-label text-label-sm">${E(n.fase_siklus)}</span>` : ''}${liv.has(x.id) ? '<span class="px-2.5 py-0.5 rounded-sm bg-pastel-rose text-on-pastel-rose font-label text-label-sm">Sedang berlangsung</span>' : ''}</div><div>${bt('n', x.id, 'R', n.judul, 'font-headline text-title-md text-light-primary hover:underline cursor-pointer text-left')}</div><p class="text-body-md text-light-on-surface-variant">${E(n.deskripsi)}</p>${nx && nx.alt.length ? `<p class="text-label-sm text-light-on-surface-variant flex flex-wrap items-center gap-1.5 pt-1">Kemungkinan lain: ${nx.alt.map(o => `<button type="button" data-fork="${i + 1}|${E(o.ke_node)}" class="px-2.5 py-0.5 rounded-sm bg-pastel-sky text-on-pastel-sky font-label text-label-sm cursor-pointer hover:bg-light-primary hover:text-light-on-primary">${E(D.nm[o.ke_node].judul)}</button>`).join(' ')}</p>` : ''}</div>`;
            });
            const last = P[P.length - 1].id, fb = D.edges.filter(e => e.dari_node === last && e.tipe_edge === 'feedback' && D.nm[e.ke_node]);
            const ids = P.map(x => x.id), ag = {}; D.impacts.filter(i => ids.includes(i.node_id)).forEach(i => { const k = i.target_tipe + '|' + i.target_id; (ag[k] = ag[k] || []).push(i.arah); });
            const ch = Object.entries(ag).slice(0, 16).map(([k, a]) => { const [t, id] = k.split('|'), l = t === 'saham' ? id : (D.sm[id] || {}).nama_sektor; return l ? bt(t === 'saham' ? 'k' : 's', id, 'R', l, 'px-3 py-1 rounded-sm font-label text-label-sm cursor-pointer ' + (TC[tn(a)] || 'bg-light-surface-container')) : ''; }).join(' ');
            h += `</div>${fb.length ? `<p class="text-body-md text-light-primary font-medium">↺ Lingkaran umpan balik: ${fb.map(e => E(e.mekanisme)).join(' ')}</p>` : ''}
        <div class="flex flex-col gap-2 pt-2"><h3 class="font-headline text-title-lg text-light-on-surface">Sektor dan saham yang terpapar di alur ini</h3><p class="text-label-sm text-light-on-surface-variant">Hijau menguntungkan, merah menekan, kuning campuran.</p><div class="flex flex-wrap gap-2">${ch || '<p class="text-body-md text-light-on-surface-variant">Belum ada pemetaan.</p>'}</div><div><button type="button" data-t="n" data-id="${E(chainId)}" data-d="R" data-map="1" class="mt-2 px-5 py-2.5 rounded-sm bg-light-primary text-light-on-primary font-label text-label-lg cursor-pointer hover:bg-light-primary-container transition-colors duration-state-change">Buka di peta bubble</button></div><p class="text-label-sm text-light-on-surface-variant pt-2 border-t border-light-outline-variant/50">${DISC}</p></div>`;
            $('#app').innerHTML = h;
        }

        const LANES = [['pendapatan', 'Pendapatan', 'Dari mana uang masuk, dan apa yang bisa mengubahnya?', /pendapatan|volume|permintaan/], ['biaya', 'Biaya', 'Apa yang membuat ongkos produksi dan operasional naik atau turun?', /biaya|margin|hpp/], ['utang', 'Utang', 'Seberapa besar beban bunga, kurs, dan pinjaman?', /utang|bunga|kredit|rekapitalisasi/], ['valuasi', 'Valuasi', 'Bagaimana pasar menilai saham ini?', /valuasi/], ['lain', 'Lainnya', '', null]];
        const FL = { kemasan_plastik: ['biaya'], bahan_baku_impor: ['biaya'], bahan_kimia_petrokimia: ['biaya'], energi_intensif: ['biaya'], tenaga_kerja: ['biaya'], pass_through_terbatas: ['biaya'], pendapatan_usd: ['pendapatan'], harga_komoditas: ['pendapatan'], konsumsi_domestik: ['pendapatan'], belanja_negara: ['pendapatan'], cuaca_musiman: ['pendapatan'], utang_usd: ['utang'], sensitif_bunga: ['utang', 'valuasi'], valuasi_growth: ['valuasi'] };
        function stockCard() {
            const s = D.tm[stockId]; if (!s) { stockId = null; return home(); }
            const sec = D.sm[s.sektor_id], liv = new Set(D.live.filter(l => l.status !== 'mereda').map(l => l.node_id)), L = {}, put = (k, x) => (L[k] = L[k] || []).push(x);
            const imp = D.impacts.filter(i => D.nm[i.node_id] && ((i.target_tipe === 'saham' && i.target_id === s.ticker) || (i.target_tipe === 'sektor' && i.target_id === s.sektor_id))), pf = D.stock_profile.filter(p => p.ticker === s.ticker);
            const JL = j => { const a = String(j || '').toLowerCase().split(/[,|]/).map(x => x.trim()).filter(x => LANES.some(l => l[0] === x)); return a.length ? a : null; };
            pf.forEach(p => (JL(p.jalur) || FL[p.faktor] || ['lain']).forEach(k => put(k, { p })));
            imp.forEach(i => { const ks = JL(i.jalur) || LANES.filter(l => l[3] && l[3].test(i.saluran || '')).map(l => l[0]); (ks.length ? ks : ['lain']).forEach(k => put(k, { i })); });
            const it = x => x.p
                ? `<div class="border-t border-light-outline-variant/50 py-2.5 flex flex-col gap-1"><div class="flex flex-wrap items-center gap-2"><b>${E(fl(x.p.faktor))}</b> <span class="px-2 py-0.5 rounded-sm bg-pastel-sky text-on-pastel-sky font-label text-label-sm">Eksposur ${E(x.p.besar)}</span> ${dr(x.p)}</div><small class="text-label-sm text-light-on-surface-variant">${E(x.p.keterangan)}</small></div>`
                : `<div class="border-t border-light-outline-variant/50 py-2.5 flex flex-col gap-1"><div class="flex flex-wrap items-center gap-2"><span class="font-bold ${x.i.arah === 'positif' ? 'text-on-pastel-mint' : x.i.arah === 'negatif' ? 'text-on-pastel-rose' : 'text-on-pastel-amber'}">${x.i.arah === 'positif' ? '▲' : x.i.arah === 'negatif' ? '▼' : '◆'}</span>${bt('n', x.i.node_id, 'R', D.nm[x.i.node_id].judul)} ${liv.has(x.i.node_id) ? '<span class="px-2 py-0.5 rounded-sm bg-pastel-rose text-on-pastel-rose font-label text-label-sm">Sedang berlangsung</span>' : ''} ${dr(x.i)}</div><small class="text-label-sm text-light-on-surface-variant ${D.nm[x.i.node_id].akses === 'premium' ? 'lock' : ''}">${x.i.arah === 'positif' ? 'Menguntungkan' : x.i.arah === 'negatif' ? 'Menekan' : 'Campuran'}. ${E(x.i.alasan)} (${E(x.i.horizon)})</small></div>`;
            const peers = D.stocks.filter(x => x.sektor_id === s.sektor_id && x.ticker !== s.ticker);
            $('#app').innerHTML = `
        <div class="flex flex-wrap items-center gap-3">${bk()}<h2 class="font-headline text-headline-md text-light-on-surface font-mono">${E(s.ticker)} <span class="font-body text-title-md text-light-on-surface-variant">${E(s.nama)}</span></h2></div>
        <p class="text-body-md text-light-on-surface-variant">${sec ? bt('s', sec.id, 'R', sec.nama_sektor) + ' · ' : ''}${E(s.eksposur || '')}</p>
        <p class="text-label-sm text-light-on-surface-variant">▲ menguntungkan · ▼ menekan · ◆ campuran · tanda "Draft" = belum diverifikasi</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-stretch">${LANES.filter(l => l[0] !== 'lain' || (L.lain || []).length).map(l => `<section class="bg-pastel-lavender border border-light-outline-variant/70 rounded-sm p-5 shadow-sm flex flex-col gap-2"><h3 class="font-headline text-title-md text-light-on-surface">${l[1]}</h3>${l[2] ? `<p class="text-label-sm text-light-on-surface-variant">${l[2]}</p>` : ''}${(L[l[0]] || []).map(it).join('') || '<p class="text-label-sm text-light-on-surface-variant">Belum ada faktor tercatat.</p>'}</section>`).join('')}</div>
        ${peers.length ? `<div class="flex flex-wrap items-center gap-2 text-label-sm text-light-on-surface-variant"><span>Saham sejenis:</span> ${peers.map(x => bt('k', x.ticker, 'R', x.ticker, 'px-3 py-1 rounded-sm bg-pastel-mint text-on-pastel-mint font-mono text-label-sm cursor-pointer')).join(' ')} <button type="button" data-cmpg="${E(s.sektor_id)}" class="px-4 py-1.5 rounded-sm bg-light-surface-container-lowest border border-light-outline-variant font-label text-label-sm text-light-on-surface hover:border-light-primary cursor-pointer">Bandingkan</button></div>` : ''}
        <div><button type="button" data-t="k" data-id="${E(s.ticker)}" data-d="R" data-map="1" class="px-5 py-2.5 rounded-sm bg-light-primary text-light-on-primary font-label text-label-lg cursor-pointer hover:bg-light-primary-container transition-colors duration-state-change">Lihat di peta bubble</button></div>
        <p class="text-label-sm text-light-on-surface-variant pt-2 border-t border-light-outline-variant/50">Menampilkan efek positif dan negatif tanpa skor atau peringkat. ${pf.concat(imp).some(r => r.status !== 'verified') ? 'Sebagian data sedang diverifikasi. ' : ''}${DISC}</p>`;
        }

        document.addEventListener('click', e => {
            const pgb = e.target.closest('[data-pg]'); if (pgb) { const [k, d] = pgb.dataset.pg.split(':'); pg[k] = Math.max(0, pg[k] + +d); ({ res: resRender, sc: scGrid, bd: board, qt: quotes })[k](); if (k === 'bd' || k === 'qt') scrollTo(0, 0); return; }
            const qtb = e.target.closest('[data-qty]'); if (qtb) { qty = qtb.dataset.qty; pg.res = 0; resRender(); return; }
            const qgb = e.target.closest('[data-qg]'); if (qgb) { qg = qgb.dataset.qg; pg.qt = 0; quotes(); return; }
            const m2 = e.target.closest('[data-m2]'); if (m2) { mode = m2.dataset.m2; trail = []; chainId = stockId = null; hist = []; view(); scrollTo(0, 0); return; }
            const sfb = e.target.closest('[data-sf]'); if (sfb) { sf = sfb.dataset.sf; pg.sc = 0; scGrid(); $('#app').querySelectorAll('[data-sf]').forEach(b => { const on = b.dataset.sf === sf; b.className = 'flex-none px-4 py-2 min-h-[40px] rounded-sm font-label text-label-lg transition-colors duration-state-change ease-state-change cursor-pointer ' + (on ? 'bg-light-primary text-light-on-primary shadow-sm' : 'bg-light-surface-container-lowest border border-light-outline-variant text-light-on-surface hover:border-light-primary hover:bg-pastel-lavender hover:text-on-pastel-lavender'); }); return; }
            const bkb = e.target.closest('[data-back]'); if (bkb) { const h = hist.pop(); if (h) { mode = h.mode; chainId = h.chainId; stockId = h.stockId; trail = h.trail; forced = h.forced; view(); scrollTo(0, 0); } return; }
            const fk = e.target.closest('[data-fork]'); if (fk) { const [i, id] = fk.dataset.fork.split('|'); forced = [...curP.slice(0, +i).map(x => x.id), id]; chain(); return; }
            const chb = e.target.closest('[data-chain]'); if (chb) { snap(); trail = []; chainId = chb.dataset.id; stockId = null; forced = []; view(); scrollTo(0, 0); return; }
            const cdb = e.target.closest('[data-card]'); if (cdb) { snap(); trail = []; stockId = cdb.dataset.id; chainId = null; view(); scrollTo(0, 0); return; }
            const cgb = e.target.closest('[data-cmpg]'); if (cgb) { mode = 'cmp'; cg = cgb.dataset.cmpg; cc = cf = null; trail = []; chainId = stockId = null; hist = []; view(); return; }
            const a1 = e.target.closest('[data-bf]'); if (a1) { bf = a1.dataset.bf; pg.bd = 0; board(); return; }
            const a2 = e.target.closest('[data-cg]'); if (a2) { cg = a2.dataset.cg; cc = cf = null; cmp(); return; }
            const a3 = e.target.closest('[data-cf],[data-cell]'); if (a3) { cf = a3.dataset.cf || null; cc = a3.dataset.cell || null; $('#cd').innerHTML = cdet(); $('#cd').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); return; }
            const ix = e.target.closest('[data-ix]'); if (ix) { trail = trail.slice(0, +ix.dataset.ix + 1); view(); return; }
            const tm = e.target.closest('[data-term]'); if (tm) { const g = D.glossary.find(x => x.istilah.toLowerCase() === tm.dataset.term.toLowerCase()); $('#def').innerHTML = `<div class="mt-2 p-3 rounded-md bg-pastel-sky/60 text-body-md"><b>${E(tm.dataset.term)}</b>: ${E(g ? g.definisi : 'Definisi belum ditambahkan.')}</div>`; return; }
            const b = e.target.closest('[data-t]'); if (b && !b.classList.contains('me')) go({ t: b.dataset.t, id: b.dataset.id, map: b.dataset.map }, b.dataset.d || 'R');
        });

        init(DEMO);
        fetch('data.json').then(r => r.ok ? r.json() : fetch('../../uploads/data-b08e60.json').then(r2 => r2.ok ? r2.json() : null)).then(d => { if (d && d.nodes) init(d); }).catch(() => { });
    </script>
